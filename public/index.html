<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khao Niao Gai Yang Team</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#16295a;--blue:#1f4fd1;--bg:#f2f5fa;--line:#e1e7f0;--ink:#1d2939;--mut:#667085}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.hero{background:url(login-bg.jpg) center/cover,url(login-bg.svg) center bottom/cover;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;padding:12vh 30px 30px;color:var(--navy)}
.hero .ic{font-size:56px}.hero h2{margin:8px 0 2px;font-size:22px}.hero p{margin:4px 0;max-width:300px;color:#2d4a73}
.lf{display:grid;place-items:center;padding:24px;background:#fff}.lf form{width:min(340px,100%)}.lf h1{font-size:26px;color:var(--navy);margin:0 0 20px}
label{display:block;font-weight:600;font-size:13px;margin-top:12px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #cfd8e6;border-radius:8px;font:inherit;margin-top:5px;background:#fff}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--mut)}.chk input{width:auto;margin:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:600 14px inherit;cursor:pointer}
.btn.w{width:100%;padding:12px;margin-top:14px;background:var(--navy)}.btn.s{padding:5px 12px;font-size:13px}.btn.o{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn.r{background:#d92d20}.btn.g{background:#12805c}
.lk{display:block;text-align:center;margin-top:14px;color:var(--blue)}.err{color:#d92d20;font-size:13px;min-height:18px;margin:6px 0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
#app{display:none;min-height:100vh}aside{position:fixed;inset:0 auto 0 0;width:210px;background:var(--navy);color:#cdd7ee;padding:14px 10px;overflow:auto}
aside b{display:block;color:#fff;padding:6px 10px 16px;font-size:15px}aside button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
aside .on,aside button:hover{background:#2a4585;color:#fff}.top{margin-left:210px;background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;justify-content:flex-end;gap:14px;align-items:center}
main{margin-left:210px;padding:22px 24px}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 10px;font-size:16px}
.panel{background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px #6b413012;border-radius:14px;padding:16px;margin-bottom:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th{background:#f7f9fc;color:var(--mut);font-weight:600}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}.row>.btn{flex:none}.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card{border-radius:14px;padding:16px;background:#fff;border:1px solid var(--line)}.card b{font-size:30px;display:block}
.c1{background:#e8f0ff}.c2{background:#e3f6ec}.c3{background:#fdeceb}.c4{background:#fff1e0}
.tag{padding:2px 10px;border-radius:12px;font-size:12px;background:#e3f6ec;color:#12805c}.tag.w{background:#fff1e0;color:#b54708}.tag.x{background:#fdeceb;color:#b42318}
.bars{display:flex;gap:18px;align-items:flex-end;height:180px;padding-top:10px}.bars div{flex:1;text-align:center;font-size:12px}.bars i{display:block;background:var(--blue);border-radius:6px 6px 0 0;margin-bottom:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{background:none;border:0;padding:8px 16px;cursor:pointer;font:inherit;border-bottom:3px solid transparent}.tabs .on{color:var(--blue);border-color:var(--blue);font-weight:600}
.pgr{display:flex;gap:4px;justify-content:flex-end;margin-top:12px}.pgr button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}.pgr .on{background:var(--blue);color:#fff}
.av{width:72px;height:72px;border-radius:50%;background:#c9d6f5;display:grid;place-items:center;font-size:28px;color:var(--navy);font-weight:700}.pf{display:flex;gap:16px;align-items:center;margin-bottom:12px}
dialog{border:0;border-radius:14px;padding:22px;width:min(520px,95vw)}.sum p{display:flex;justify-content:space-between;margin:8px 0}
.avi{width:var(--s,32px);height:var(--s,32px);border-radius:50%;object-fit:cover;background:#c9d6f5;display:inline-grid;place-items:center;font-weight:700;color:var(--navy);vertical-align:middle;flex:none}#who{display:flex;align-items:center;gap:8px}.avb{border:0;background:none;padding:0;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cd{min-height:88px;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;background:#fff;display:flex;flex-direction:column;gap:2px;overflow:hidden}.cd.off{border:0;background:none}.cd.wk{background:#f4f6fa}.cd.hol{background:#fdeceb}.cd.td{outline:2px solid var(--blue)}.hn{color:#b42318}.wn{color:var(--mut)}.dh{text-align:center;font-weight:600;color:var(--mut)}
.rc{border-radius:6px;padding:1px 6px;font-size:11px}.rc.leave{background:#e3f6ec;color:#12805c}.rc.absent{background:#fdeceb;color:#b42318}.rc.late{background:#fff1e0;color:#b54708}.rc.ot{background:#e8f0ff;color:#1f4fd1}.lg{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn,aside button{transition:background-color .2s,filter .2s}.btn:hover{filter:brightness(1.07)}.top{box-shadow:0 1px 8px #6b413010}
.hb{display:grid;grid-template-columns:minmax(80px,150px) 1fr 30px 40px;gap:8px;align-items:center;margin:7px 0}.hb>div{background:#eef2f8;border-radius:6px;height:14px;overflow:hidden}.hb>div.st{display:flex}.hb i{display:block;height:100%}.hb small{color:var(--mut)}.lgd{display:inline-flex;align-items:center;gap:5px;margin:0 12px 6px 0;font-size:12px;color:var(--mut)}.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block}
.manual h2{margin:24px 0 8px;font-size:18px;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:4px}.manual h2::before{counter-increment:ms;content:counter(ms) ". "}.manual{counter-reset:ms}.manual h3{font-size:15px;margin:16px 0 6px}.manual p,.manual li{line-height:1.75}.manual code{background:#f2f5fa;padding:1px 5px;border-radius:4px;font-size:13px}.manual table{margin:8px 0}.mtoc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
@media print{aside,.top,.noprint{display:none!important}main{margin-left:0!important}.panel{box-shadow:none}}
@media(max-width:800px){#login{grid-template-columns:1fr}.hero{display:none}aside{position:static;width:auto}.top,main{margin-left:0}.cards{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><div class="hero"><div class="ic">🍗</div><h2>Khao Niao Gai Yang Team</h2><p>ระบบจัดการข้อมูลพนักงาน</p><p>บริหารจัดการพนักงานอย่างมีประสิทธิภาพ ด้วยเทคโนโลยีที่ทันสมัย</p></div>
<div class="lf"><form id="lf"><h1>เข้าสู่ระบบ</h1><label>ชื่อผู้ใช้<input id="u" autocomplete="username" placeholder="ชื่อผู้ใช้ / อีเมล" required></label>
<label>รหัสผ่าน<input id="p" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" required></label>
<label class="chk" style="margin-top:14px"><input type="checkbox" id="rm">จดจำการเข้าสู่ระบบ</label><p class="err" id="err" role="alert"></p>
<button class="btn w">เข้าสู่ระบบ</button><a href="#" class="lk" id="fg">ลืมรหัสผ่าน?</a></form></div></div>
<div id="app"><aside><b>🍗 Khao Niao Gai Yang Team</b><nav id="nav"></nav></aside><div class="top"><span id="who"></span><button class="btn s o" id="pwb">🔑 เปลี่ยนรหัสผ่าน</button><button class="btn s o" id="out">ออกจากระบบ</button></div><main id="v"></main></div>
<dialog id="dlg"><form id="df" method="dialog"></form></dialog>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),D=s=>s?String(s).slice(0,10):'-',C=i=>'EMP'+String(i).padStart(3,'0'),M=n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
let T=localStorage.t||sessionStorage.t,R,L,P,ME,NM,CUR,PV=0;
const TY={absent:'ขาด',leave:'ลา',late:'มาสาย',ot:'OT'},ST={active:'ปฏิบัติงาน',on_leave:'ลาพัก',resigned:'ลาออก/พ้นสภาพ',pending:'รออนุมัติ',approved:'อนุมัติแล้ว',rejected:'ไม่อนุมัติ',cancelled:'ยกเลิก'},RL={hr:'ฝ่าย HR',manager:'ผู้บริหาร',employee:'พนักงานทั่วไป'};
const tag=s=>`<span class="tag ${s==='pending'?'w':/rejected|resigned|cancelled/.test(s)?'x':''}">${ST[s]||s}</span>`;
async function api(p,o={}){const r=await fetch('/api'+p,{method:o.m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:o.b&&JSON.stringify(o.b)});
 const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&T)out();throw new Error(j.error||'เกิดข้อผิดพลาด')}return j}
const out=()=>{localStorage.clear();sessionStorage.clear();location.reload()},sel=(id,a,k,n,v)=>`<select id="${id}">${a.map(x=>`<option value="${x[k]}"${x[k]==v?' selected':''}>${E(x[n])}</option>`).join('')}</select>`;
$('#fg').onclick=e=>{e.preventDefault();$('#err').textContent='กรุณาติดต่อฝ่าย HR เพื่อรีเซ็ตรหัสผ่าน'};
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value.trim(),password:$('#p').value})}),j=await r.json();
  if(!r.ok)throw new Error(j.error);(($('#rm').checked?localStorage:sessionStorage).t=j.token);T=j.token;start()}catch(x){$('#err').textContent=x.message}};
$('#out').onclick=out;
$('#pwb').onclick=()=>{$('#df').innerHTML=`<h3 style="margin-top:0">เปลี่ยนรหัสผ่าน</h3>
<label>รหัสผ่านปัจจุบัน<input id="pw0" type="password" autocomplete="current-password"></label>
<label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)<input id="pw1" type="password" autocomplete="new-password"></label>
<label>ยืนยันรหัสผ่านใหม่<input id="pw2" type="password" autocomplete="new-password"></label>
<p class="err" id="fe" role="alert"></p><div class="row" style="justify-content:flex-end"><button class="btn o" value="x">ยกเลิก</button><button class="btn" id="sv" type="button">บันทึก</button></div>`;
 ['#pw0','#pw1','#pw2'].forEach(i=>$(i).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#sv').click()}});
 $('#sv').onclick=async()=>{const a=$('#pw0').value,b=$('#pw1').value,fe=$('#fe');
  if(!a||!b)return fe.textContent='กรอกข้อมูลให้ครบ';if(b.length<8)return fe.textContent='รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร';
  if(b!==$('#pw2').value)return fe.textContent='รหัสผ่านใหม่ไม่ตรงกัน';if(b===a)return fe.textContent='รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านเดิม';
  try{await api('/change-password',{m:'POST',b:{current_password:a,new_password:b}});$('#dlg').close();alert('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว')}catch(x){fe.textContent=x.message}};$('#dlg').showModal()};
const TABS={hr:[['dash','🏠 หน้าหลัก',vDash],['emp','👥 ข้อมูลพนักงาน',vEmp],['att','🗓 ขาด ลา มาสาย',()=>vRec(['absent','leave','late'],'บันทึกขาด ลา มาสาย')],['ot','⏱ OT',()=>vRec(['ot'],'บันทึกและสรุป OT')],['pay','💰 เงินเดือน',vPay],['org','🏢 แผนก/ตำแหน่ง',vOrg],['req','🔁 เปลี่ยนตำแหน่ง/แผนก',vReq],['res','🚪 ลาออก/พ้นสภาพ',vRes],['cal','📅 ปฏิทิน',vCal],['rep','📊 รายงานและ Dashboard',vRep],['bak','💾 สำรองข้อมูล',vBak],['man','📖 คู่มือการใช้งาน',vManual]],
 manager:[['dash','🏠 หน้าหลัก',vDash],['req','✅ รออนุมัติ',vReq],['cal','📅 ปฏิทิน',vCal],['rep','📊 รายงานและ Dashboard',vRep],['man','📖 คู่มือการใช้งาน',vManual]],employee:[['me','👤 ข้อมูลส่วนตัว',vMe],['mrec','🗓 ขาด ลา มาสาย',()=>vMyRec(['absent','leave','late'],'ขาด ลา มาสายของฉัน')],['mot','⏱ OT ของฉัน',()=>vMyRec(['ot'],'OT ของฉัน')],['mpay','💰 เงินเดือนของฉัน',vMyPay],['cal','📅 ปฏิทิน',vCal],['man','📖 คู่มือการใช้งาน',vManual]]};
async function start(){if(!T)return;try{const p=JSON.parse(decodeURIComponent(escape(atob(T.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));R=p.role==='admin'?'hr':p.role;ME=p.eid;NM=p.name;renderWho()}catch{return out()}
 L=await api('/lookups').catch(()=>out());$('#login').style.display='none';$('#app').style.display='block';go(TABS[R][0][0])}
function go(t){CUR=t;$('#nav').innerHTML=TABS[R].map(x=>`<button class="${x[0]===t?'on':''}" data-t="${x[0]}">${x[1]}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));TABS[R].find(x=>x[0]===t)[2]().catch(e=>$('#v').innerHTML=`<p class="err">${E(e.message)}</p>`)}
const av=(id,n,s=32)=>id?`<img class="avi" style="--s:${s}px" src="/api/photo/${id}?t=${T}&v=${PV}" alt="" data-n="${E((n||'?')[0])}" onerror="ph(this)">`:`<span class="avi" style="--s:${s}px">${E((n||'?')[0])}</span>`;
function ph(i){const s=document.createElement('span');s.className='avi';s.style.cssText=i.style.cssText;s.textContent=i.dataset.n;i.replaceWith(s)}
function pickPhoto(id,done){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),S=192,m=Math.min(im.width,im.height);c.width=c.height=S;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
 api('/photo/'+id,{m:'POST',b:{image:c.toDataURL('image/jpeg',.8)}}).then(()=>{PV=Date.now();done()}).catch(e=>alert(e.message))};im.onerror=()=>alert('ไฟล์นี้ไม่ใช่รูปภาพ');im.src=r.result};r.readAsDataURL(f)};i.click()}
const bindPh=(root,done)=>root.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>pickPhoto(+b.dataset.ph,done));
const renderWho=()=>{$('#who').innerHTML=(ME?`<button class="avb" data-ph="${ME}" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์">${av(ME,NM,36)}</button>`:av(0,NM,36))+`<span>${E(NM)} <small>(${RL[R]})</small></span>`;bindPh($('#who'),()=>{renderWho();go(CUR)})};
const prof=e=>`<div class="pf">${av(e.employee_id,e.first_name,72)}<div><h3 style="margin:0">${E(e.first_name+' '+e.last_name)}</h3>รหัสพนักงาน: ${C(e.employee_id)} ${tag(e.employment_status)}<br>ตำแหน่ง: ${E(e.position_name)} · แผนก: ${E(e.department_name)}${R==='hr'||e.employee_id===ME?`<br><button type="button" class="btn s o" data-ph="${e.employee_id}">เปลี่ยนรูป</button>`:''}</div></div>
<table><tr><th>เบอร์โทรศัพท์<td>${E(e.phone||'-')}<tr><th>อีเมล<td>${E(e.email)}<tr><th>ที่อยู่<td>${E(e.address||'-')}<tr><th>วันเริ่มงาน<td>${D(e.hire_date)}<tr><th>หัวหน้า<td>${E(e.manager_name||'-')}<tr><th>วันลาคงเหลือ<td>${e.day_off}</table>`;
async function vMe(){const m=await api('/me');$('#v').innerHTML='<h2>ข้อมูลส่วนตัว</h2><div class="panel">'+(m?prof(m):'<p class="err">ไม่พบข้อมูลพนักงาน กรุณาติดต่อฝ่าย HR</p>')+'</div>';bindPh($('#v'),vMe)}
async function vDash(){const[r,q]=await Promise.all([api('/report'),api('/requests')]),t=n=>(r.today.find(x=>x.name===n)||{total:0}).total,tot=r.byDept.reduce((s,x)=>s+x.total,0),mx=Math.max(1,...r.byDept.map(x=>x.total)),pend=q.filter(x=>x.status==='pending'),mo=r.monthly||[],sm=k=>mo.reduce((s,x)=>s+(+x[k]||0),0),ml=r.month?MN[+r.month.slice(5)-1]+' '+(+r.month.slice(0,4)+543):'';
 $('#v').innerHTML=`<h2>สวัสดี, ${E(NM)}</h2><div class="cards"><div class="card c1"><b>${tot}</b>พนักงานทั้งหมด</div><div class="card c2"><b>${t('absent')+t('leave')}</b>ขาด/ลา วันนี้</div><div class="card c3"><b>${t('late')}</b>มาสาย วันนี้</div><div class="card c4"><b>${t('ot')}</b>ทำ OT วันนี้</div></div>
 <h3>สรุปประจำเดือน ${ml}</h3><div class="cards"><div class="card c2"><b>${sm('absent')}</b>ขาด (วัน)</div><div class="card c2"><b>${sm('leave')}</b>ลา (วัน)</div><div class="card c3"><b>${sm('late')}</b>มาสาย (ครั้ง)</div><div class="card c4"><b>${sm('ot_hours')}</b>ชั่วโมง OT</div></div>
 <div class="g2"><div class="panel"><h3>จำนวนพนักงานแยกตามแผนก</h3><div class="bars">${r.byDept.map(x=>`<div><i style="height:${x.total/mx*140}px"></i>${x.total}<br>${E(x.name)}</div>`).join('')||'ไม่มีข้อมูล'}</div></div>
 <div class="panel"><h3>คำขอรออนุมัติ</h3><p style="font-size:30px;margin:6px 0"><b>${pend.length}</b> รายการ</p>${pend.slice(0,4).map(x=>`<p>${E(x.emp)} → ${E(x.new_pos)}</p>`).join('')}<button class="btn s o" onclick="go('req')">ดูทั้งหมด</button></div></div>`}
async function vEmp(){let all=[],pg=1;const N=8,opt=(a,k,n,l)=>`<option value="">${l}</option>`+a.map(x=>`<option value="${x[k]}">${E(x[n])}</option>`).join('');

 const draw=()=>{const f=all.filter(e=>(!$('#fd').value||e.department_id==$('#fd').value)&&(!$('#fp').value||e.position_id==$('#fp').value)),pages=Math.ceil(f.length/N)||1;pg=Math.min(pg,pages);

async function vCal(){let m=new Date().toISOString().slice(0,7);
 const draw=async()=>{const d=await api('/calendar?month='+m),[y,mo]=m.split('-').map(Number),first=new Date(y,mo-1,1).getDay(),n=new Date(y,mo,0).getDate(),today=new Date().toISOString().slice(0,10),H={},Rc={};
  d.records.forEach(r=>(Rc[r.work_date]=Rc[r.work_date]||[]).push(r));

  for(let i=1;i<=n;i++){const k=m+'-'+Z2(i),w=(first+i-1)%7===0||(first+i-1)%7===6,hd=hol(k),rs=Rc[k]||[];
   cells+=`<div class="cd${hd?' hol':w?' wk':''}${k===today?' td':''}"><b>${i}</b>${hd?`<small class="hn">${E(hd)}</small>`:w?'<small class="wn">วันหยุดสุดสัปดาห์</small>':''}${rs.slice(0,3).map(r=>`<span class="rc ${r.record_type}">${d.all?E(r.emp.split(' ')[0])+' ':''}${TY[r.record_type]}${r.record_type==='ot'?' '+r.ot_hours+' ชม.':''}</span>`).join('')}${rs.length>3?`<small>+${rs.length-3} รายการ</small>`:''}</div>`}
  $('#v').innerHTML=`<h2>ปฏิทิน</h2><div class="panel"><div class="row" style="align-items:center"><button class="btn s o" id="pv">◀</button><h3 style="margin:0;text-align:center">${MN[mo-1]} ${y+543}</h3><button class="btn s o" id="nx">▶</button></div><div class="cal" style="margin-top:12px">${['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells}</div>
  <div class="lg"><span class="rc hol" style="background:#fdeceb;color:#b42318">วันหยุดนักขัตฤกษ์</span><span class="rc" style="background:#f4f6fa">วันหยุดสุดสัปดาห์</span><span class="rc leave">ลา</span><span class="rc absent">ขาด</span><span class="rc late">มาสาย</span><span class="rc ot">OT</span></div></div>`;
  const sh=k=>{const t=new Date(y,mo-1+k,1);m=t.getFullYear()+'-'+Z2(t.getMonth()+1);draw().catch(e=>$('#v').innerHTML=`<p class="err">${E(e.message)}</p>`)};

 await draw()}
