</style></head><body>
<div id="login"><div class="hero" aria-hidden="true"></div>
<div class="lf"><form id="lf"><h1>Login</h1>
<div class="fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="u" autocomplete="username" placeholder="Email or Username" aria-label="Email or Username" required></div>
<div class="fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="p" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required></div>
<a href="#" class="lk" id="fg">Forget Password?</a><p class="err" id="err" role="alert"></p>

<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),D=s=>s?String(s).slice(0,10):'-',C=i=>'EMP'+String(i).padStart(3,'0'),M=n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
let T=localStorage.t||sessionStorage.t,R,L,P,ME,NM,UN,CUR,PV=0;
const TY={absent:'ขาด',leave:'ลา',late:'มาสาย',ot:'OT'},ST={active:'ปฏิบัติงาน',on_leave:'ลาพัก',resigned:'ลาออก/พ้นสภาพ',pending:'รออนุมัติ',approved:'อนุมัติแล้ว',rejected:'ไม่อนุมัติ',cancelled:'ยกเลิก'},RL={hr:'ฝ่าย HR',manager:'ผู้บริหาร',employee:'พนักงานทั่วไป'};
const tag=s=>`<span class="tag ${s==='pending'?'w':/rejected|resigned|cancelled/.test(s)?'x':''}">${ST[s]||s}</span>`;
async function api(p,o={}){const r=await fetch('/api'+p,{method:o.m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:o.b&&JSON.stringify(o.b)});
 const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&T)out();throw new Error(j.error||'เกิดข้อผิดพลาด')}return j}
const out=()=>{localStorage.clear();sessionStorage.clear();location.reload()},selN=(id,a,k,n)=>`<select id="${id}"><option value="">- ไม่เปลี่ยน -</option>${a.map(x=>`<option value="${x[k]}">${E(x[n])}</option>`).join('')}</select>`,sel=(id,a,k,n,v)=>`<select id="${id}">${a.map(x=>`<option value="${x[k]}"${x[k]==v?' selected':''}>${E(x[n])}</option>`).join('')}</select>`;
/* ช่องค้นหาพนักงาน: พิมพ์ชื่อ/รหัส/แผนก แล้วกดเลือกจากรายการ (ค่าอยู่ใน hidden input #id เหมือน select เดิม) */
const CB={},cbL=x=>C(x.employee_id)+' '+x.first_name+' '+x.last_name,
empPick=(id,a,v,ph)=>{CB[id]=a;const s=a.find(x=>x.employee_id==v);return `<div class="cb"><input type="hidden" id="${id}" value="${s?s.employee_id:''}"><input class="cbi" data-cb="${id}" role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" placeholder="${E(ph||'พิมพ์ชื่อหรือรหัสเพื่อค้นหา...')}" value="${s?E(cbL(s)):''}"><ul class="cbl" role="listbox" hidden></ul></div>`},
cbU=i=>i.closest('.cb').querySelector('.cbl'),cbH=i=>i.closest('.cb').querySelector('input[type=hidden]'),
cbPos=i=>{const u=cbU(i),r=i.getBoundingClientRect(),below=innerHeight-r.bottom,up=below<200&&r.top>below;u.style.left=r.left+'px';u.style.width=r.width+'px';u.style.top=up?'auto':r.bottom+4+'px';u.style.bottom=up?innerHeight-r.top+4+'px':'auto';u.style.maxHeight=Math.max(120,Math.min(260,(up?r.top:below)-12))+'px'},
cbClose=i=>{cbU(i).hidden=true;i.setAttribute('aria-expanded','false')},
cbDraw=i=>{const u=cbU(i),q=i.dataset.t==='1'?i.value.trim().toLowerCase():'',f=(CB[i.dataset.cb]||[]).filter(x=>(cbL(x)+' '+(x.department_name||'')+' '+(x.position_name||'')).toLowerCase().includes(q)).slice(0,50);
 u.innerHTML=f.length?f.map((x,k)=>`<li role="option" data-i="${x.employee_id}"${k?'':' class="on"'}><b>${C(x.employee_id)}</b> ${E(x.first_name+' '+x.last_name)}<small>${E([x.department_name,x.position_name].filter(Boolean).join(' · '))}</small></li>`).join(''):'<li class="no">ไม่พบพนักงาน</li>';
 u.hidden=false;i.setAttribute('aria-expanded','true');cbPos(i)},
cbPick=(i,id)=>{const x=(CB[i.dataset.cb]||[]).find(e=>e.employee_id==id);cbH(i).value=x?x.employee_id:'';cbH(i).dispatchEvent(new Event('change'));i.value=x?cbL(x):'';i.dataset.t='0';cbClose(i)};
document.addEventListener('focusin',e=>{const i=e.target;if(i.classList&&i.classList.contains('cbi')){i.dataset.t='0';i.select();cbDraw(i)}});
document.addEventListener('click',e=>{const i=e.target;if(i.classList&&i.classList.contains('cbi')&&cbU(i).hidden){i.dataset.t='0';cbDraw(i)}});
document.addEventListener('input',e=>{const i=e.target;if(i.classList&&i.classList.contains('cbi')){i.dataset.t='1';cbH(i).value='';cbH(i).dispatchEvent(new Event('change'));cbDraw(i)}});
document.addEventListener('focusout',e=>{const i=e.target;if(i.classList&&i.classList.contains('cbi')){const h=cbH(i),x=(CB[i.dataset.cb]||[]).find(v=>v.employee_id==h.value);i.value=x?cbL(x):'';cbClose(i)}});
document.addEventListener('mousedown',e=>{const li=e.target.closest&&e.target.closest('.cbl li[data-i]');if(li){e.preventDefault();cbPick(li.closest('.cb').querySelector('.cbi'),li.dataset.i)}});
document.addEventListener('keydown',e=>{const i=e.target;if(!(i.classList&&i.classList.contains('cbi')))return;const u=cbU(i),items=[...u.querySelectorAll('li[data-i]')],cur=items.findIndex(x=>x.classList.contains('on'));
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(u.hidden){cbDraw(i);return}if(!items.length)return;const n=(cur+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((x,k)=>x.classList.toggle('on',k===n));items[n].scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'){e.preventDefault();if(!u.hidden&&items[cur])cbPick(i,items[cur].dataset.i)}
 else if(e.key==='Escape'&&!u.hidden){e.preventDefault();e.stopPropagation();cbClose(i)}
 else if(e.key==='Tab')cbClose(i)});
const cbRe=e=>{const u=document.querySelector('.cbl:not([hidden])');if(u&&!(e.target&&e.target.closest&&e.target.closest('.cbl')))cbPos(u.closest('.cb').querySelector('.cbi'))};
addEventListener('scroll',cbRe,true);addEventListener('resize',cbRe);

  $('#pt').innerHTML=r?`<p>รอบ ${j.period[0]} ถึง ${j.period[1]}</p><table><tr><th>เงินเดือนรอบนี้<td>${M(r.base)} บาท<tr><th>OT<td>${r.ot} ชม. = ${M(r.ot_pay)} บาท<tr><th>ขาดงาน<td>${r.absent} วัน หัก ${M(r.deduct)} บาท<tr><th>รับสุทธิ<td><b>${M(r.net)} บาท</b></table><p style="color:var(--mut)">คำนวณ: OT = ชม. × (เงินเดือน÷240) × 1.5 · หักขาด = วัน × (เงินเดือน÷30)</p>`:'ไม่พบข้อมูลเงินเดือน กรุณาติดต่อฝ่าย HR'};
 $('#pm').onchange=$('#ph2').onchange=load;load()}
const HF={'01-01':'วันขึ้นปีใหม่','04-06':'วันจักรี','04-13':'วันสงกรานต์','04-14':'วันสงกรานต์','04-15':'วันสงกรานต์','05-01':'วันแรงงานแห่งชาติ','05-04':'วันฉัตรมงคล','06-03':'วันเฉลิมพระชนมพรรษา พระราชินี','07-28':'วันเฉลิมพระชนมพรรษา ร.10','08-12':'วันแม่แห่งชาติ','10-13':'วันคล้ายวันสวรรคต ร.9','10-23':'วันปิยมหาราช','12-05':'วันพ่อแห่งชาติ','12-10':'วันรัฐธรรมนูญ','12-31':'วันสิ้นปี'},
HV={'2026-03-03':'วันมาฆบูชา','2026-05-31':'วันวิสาขบูชา','2026-06-01':'ชดเชยวันวิสาขบูชา','2026-07-29':'วันอาสาฬหบูชา','2026-07-30':'วันเข้าพรรษา'},hol=k=>HV[k]||HF[k.slice(5)];
let CALSEL=new Set();
const CT=[['hol','วันหยุดนักขัตฤกษ์'],['wk','วันหยุดสุดสัปดาห์'],['leave','ลา'],['absent','ขาด'],['late','มาสาย'],['ot','OT']],WD=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
async function vCal(){let m=new Date().toISOString().slice(0,7),d=null;
 const draw=()=>{const[y,mo]=m.split('-').map(Number),first=new Date(y,mo-1,1).getDay(),n=new Date(y,mo,0).getDate(),today=new Date().toISOString().slice(0,10),Rc={};
  d.records.forEach(r=>(Rc[r.work_date]=Rc[r.work_date]||[]).push(r));
  const days=[];for(let i=1;i<=n;i++){const k=m+'-'+Z2(i),dow=(first+i-1)%7,w=dow===0||dow===6,hd=hol(k),rs=Rc[k]||[],kinds=new Set();if(hd)kinds.add('hol');if(w)kinds.add('wk');rs.forEach(r=>kinds.add(r.record_type));days.push({i,k,dow,w,hd,rs,kinds})}
  const sel=[...CALSEL],hit=x=>sel.some(s=>x.kinds.has(s)),dt=x=>`${x.i} ${MN[mo-1]} ${y+543}`;
  let cells='<div class="cd off"></div>'.repeat(first);
  for(const x of days)cells+=`<div class="cd${x.hd?' hol':x.w?' wk':''}${x.k===today?' td':''}${sel.length&&hit(x)?' sel':''}"><b>${x.i}</b>${x.hd?`<small class="hn">${E(x.hd)}</small>`:x.w?'<small class="wn">วันหยุดสุดสัปดาห์</small>':''}${x.rs.slice(0,3).map(r=>`<span class="rc ${r.record_type}">${d.all?E(r.emp.split(' ')[0])+' ':''}${TY[r.record_type]}${r.record_type==='ot'?' '+r.ot_hours+' ชม.':''}</span>`).join('')}${x.rs.length>3?`<small>+${x.rs.length-3} รายการ</small>`:''}</div>`;
  const rows=[];CT.forEach(([t,lb],ti)=>{if(!CALSEL.has(t))return;days.forEach(x=>{if(!x.kinds.has(t))return;
   if(t==='hol')rows.push([ti,x.i,dt(x),t,lb,E(x.hd)]);else if(t==='wk')rows.push([ti,x.i,dt(x),t,lb,'วัน'+WD[x.dow]]);
   else x.rs.filter(r=>r.record_type===t).forEach(r=>rows.push([ti,x.i,dt(x),t,lb,(d.all?E(r.emp):'')+(t==='ot'?` ${r.ot_hours} ชม.`:'')]))})});
  rows.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  $('#v').innerHTML=`<h2>ปฏิทิน</h2><div class="panel"><div class="row" style="align-items:center"><button class="btn s" id="pv" style="min-width:90px" aria-label="เดือนก่อนหน้า">◀</button><h3 style="margin:0;text-align:center">${MN[mo-1]} ${y+543}</h3><button class="btn s" id="nx" style="min-width:90px" aria-label="เดือนถัดไป">▶</button></div><div class="cal" style="margin-top:12px">${['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<div class="dh">${x}</div>`).join('')}${cells}</div>
  <div class="lg" role="group" aria-label="เลือกประเภทที่ต้องการดู">${CT.map(([t,lb])=>`<button type="button" class="tg rc ${t}" data-ct="${t}" aria-pressed="${CALSEL.has(t)}">${CALSEL.has(t)?'✓ ':''}${lb}</button>`).join('')}</div></div>
  <div class="panel"><h3>รายการในเดือนนี้ที่เลือก</h3>${sel.length?`<table><tr><th>วันที่<th>ประเภท<th>รายละเอียด</tr>${rows.map(r=>`<tr><td>${r[2]}<td><span class="rc ${r[3]}">${r[4]}</span><td>${r[5]||'-'}</tr>`).join('')||'<tr><td colspan="3">ไม่มีรายการในเดือนนี้</tr>'}</table>`:'<p style="color:var(--mut);margin:0">กดเลือกประเภทด้านบน (เลือกได้หลายประเภท) เพื่อไฮไลต์วันที่ในปฏิทินและดูรายการเป็นตาราง</p>'}</div>`;
  const sh=k=>{const t=new Date(y,mo-1+k,1);m=t.getFullYear()+'-'+Z2(t.getMonth()+1);load()};
  $('#pv').onclick=()=>sh(-1);$('#nx').onclick=()=>sh(1);
  document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{const t=b.dataset.ct;CALSEL.has(t)?CALSEL.delete(t):CALSEL.add(t);draw()})},
 load=async()=>{try{d=await api('/calendar?month='+m);draw()}catch(e){$('#v').innerHTML=`<p class="err">${E(e.message)}</p>`}};
 await load()}
async function vLogs(){let a=[],tab='all';const AL={add:'เพิ่มข้อมูล',edit:'แก้ไขข้อมูล',delete:'ลบข้อมูล',other:'อื่นๆ'};
 const draw=()=>{const f=a.filter(x=>tab==='all'||x.action===tab);
  $('#v').innerHTML=`<h2>${R==='manager'?'ประวัติการใช้งานระบบ (HR Logs)':'ประวัติการใช้งานของฉัน'}</h2><p style="color:var(--mut);margin:-6px 0 14px">${R==='manager'?'ผู้บริหารดูได้ว่า HR แต่ละคนทำอะไรในระบบบ้าง':'แสดงเฉพาะการกระทำของตัวคุณเอง'}</p>
  <div class="panel"><div class="tabs">${[['all','ทั้งหมด'],['add','เพิ่มข้อมูล'],['edit','แก้ไขข้อมูล'],['delete','ลบข้อมูล']].map(t=>`<button class="${t[0]===tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  <table><tr><th>วัน-เวลา<th>ผู้ดำเนินการ<th>การกระทำ<th>รายละเอียด</tr>${f.map(x=>`<tr><td style="white-space:nowrap">${E(x.ts)}<td>${E(x.actor)} <small style="color:var(--mut)">(${x.actor_role==='manager'?'ผู้บริหาร':'HR'})</small><td><span class="lgb ${x.action}">${AL[x.action]||AL.other}</span><td>${E(x.detail)}</tr>`).join('')||'<tr><td colspan="4">ยังไม่มีประวัติการใช้งาน</tr>'}</table></div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()})};
 a=await api('/logs');draw()}
start();
</script></body></html>
